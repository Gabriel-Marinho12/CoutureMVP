<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couture | Secure Garment Viewer</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            background-color: #0a0a0a; 
            color: #eaeaea; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .header p {
            color: #888;
            font-size: 0.9em;
        }
        .viewer-container {
            position: relative;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        canvas { 
            display: block;
        }
        /* Camada invisível para frustrar inspeção de elemento */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Couture</h1>
        <p>Secured by Solana IP Registry</p>
    </div>
    
    <div class="viewer-container">
        <canvas id="garmentCanvas" width="450" height="600"></canvas>
        <div class="overlay" oncontextmenu="return false;"></div>
    </div>

    <script>
        const canvas = document.getElementById('garmentCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        
        img.crossOrigin = "Anonymous";
        // URL de uma imagem conceitual de alta qualidade
        img.src = 'https://images.unsplash.com/photo-1539008835657-9e8e9680c956?auto=format&fit=crop&w=900&h=1200&q=80';
        
        img.onload = () => {
            // Desenha a imagem no canvas, ofuscando o arquivo original
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // Adiciona uma marca d'água sutil via código
            ctx.font = "14px Arial";
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            ctx.textAlign = "right";
            ctx.fillText("Protected by Couture IP", canvas.width - 15, canvas.height - 20);
        };

        // Desabilita interações de download
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('dragstart', event => event.preventDefault());
    </script>
</body>
</html>
